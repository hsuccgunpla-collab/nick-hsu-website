<style>
:root{--bg:#111827;--accent:#818cf8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Inter','Noto Sans TC',sans-serif;background:radial-gradient(circle at 50% 18%,rgba(79,70,229,.14),transparent 34%),radial-gradient(circle at 50% 82%,rgba(99,102,241,.05),transparent 36%),#111827;color:#e5e7eb;overflow-x:hidden}
.site-header{position:fixed;inset:0 0 auto 0;z-index:50;transition:.3s ease}
.site-header.scrolled{background:rgba(17,24,39,.9);backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,.22)}
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;padding:110px 24px 80px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:min(72vw,760px);height:min(72vw,760px);border:1px solid rgba(129,140,248,.08)}

.hero-content{position:relative;z-index:2;width:min(920px,100%);text-align:center}
.eyebrow{color:#a5b4fc;font-size:11px;letter-spacing:.28em;margin:0 0 22px}
.name{font-size:clamp(3rem,8vw,6.5rem);line-height:.95;font-weight:600;letter-spacing:.08em;color:#fff;margin:0}

.statement{margin:48px auto 0;max-width:760px;font-size:clamp(1rem,2vw,1.35rem);line-height:1.9;color:#d1d5db;font-weight:300}
.keywords{margin:22px 0 0;color:#818cf8;font-size:clamp:.7rem,1.5vw,.9rem);letter-spacing:.18em;line-height:2}

.map-button:hover{border-color:#818cf8;background:rgba(79,70,229,.22);box-shadow:0 0 28px rgba(99,102,241,.14);transform:translateY(-2px)}
.map-button span{color:#818cf8;font-size:15px}
.scroll-hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);color:#4b5563;font-size:9px;letter-spacing:.2em;text-align:center}
.scroll-line{width:1px;height:28px;margin:9px auto 0;background:linear-gradient(to bottom,#6b7280,transparent)}
.footer{position:absolute;bottom:0;left:0;right:0;padding:0 24px 22px;text-align:center;color:#374151;font-size:9px;letter-spacing:.12em}
.logo-link{display:inline-flex;align-items:center;text-decoration:none}
.site-logo{display:block;width:50px;height:50px;object-fit:contain}
.logo-link:hover .site-logo{transform:scale(1.04);transition:transform .2s ease}
.hero .eyebrow{margin-bottom:28px}
.hero .name{font-weight:600;letter-spacing:.07em}
.hero .name-zh{margin-top:16px;color:#a5b4fc;font-size:clamp(.9rem,1.8vw,1.15rem)}
.hero .statement{margin-top:44px}
.hero .keywords{margin-top:20px}


.personal-intro{

    padding:108px 24px 118px;

}
.personal-intro-inner{
    width:min(820px,100%);

}
.personal-intro-label{

}
.personal-intro-title{

    font-weight:400;
    letter-spacing:.02em;
}
.personal-intro-rule{
    width:42px;
    height:1px;
    margin:28px 0 34px;
    background:rgba(165,180,252,.55);
}
.personal-intro-copy{
    color:#aeb9c9;
    font-size:clamp(.92rem,1.6vw,1rem);
    line-height:2.05;
    font-weight:300;
}
.personal-intro-copy p{
    margin:0 0 22px;
}
.personal-intro-copy p:last-child{
    margin-bottom:0;
}
@media(max-width:767px){
    .personal-intro{
        padding:82px 22px 90px;
    }

    }

<div class="hidden md:flex items-center gap-8"><span class="text-indigo-400">HOME</span><a href="mapV7.html" class="text-gray-400 hover:text-white transition">PERSONAL MAP</a></div>
<a href="mapV7.html" class="md:hidden text-gray-400 hover:text-white text-sm">MAP</a>
</nav>
</div>

<main class="hero">
