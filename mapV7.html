        :root {
            --bg: #111827;
            --panel: rgba(31, 41, 55, 0.62);
            --line: rgba(129, 140, 248, 0.42);
            --line-soft: rgba(75, 85, 99, 0.8);
            --accent: #818cf8;
            --accent-soft: rgba(99, 102, 241, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            background:
                radial-gradient(circle at 50% 12%, rgba(79,70,229,.10), transparent 34%),
                #111827;
            color: #E5E7EB;
            overflow-x: hidden;
        }

        .nav-scrolled {
            background: rgba(17,24,39,.90);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,.22);
        }

        .map-shell {
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            height: calc(100vh - 76px);
            min-height: 620px;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            background-image:
                linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
            background-size: 42px 42px;
        }

        .map-shell.dragging { cursor: grabbing; }

        #map-stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1400px;
            height: 1000px;
            transform-origin: 50% 50%;
        }

        #connections {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .branch-path {
            fill: none;
            stroke: var(--line-soft);
            stroke-width: 3.5;
            stroke-linecap: round;
            transition: stroke .35s ease, stroke-width .35s ease, opacity .35s ease;
        }

        .branch-path.active {
            stroke: var(--accent);
            stroke-width: 4;
        }

        .branch-path.dimmed {
            opacity: .22;
        }

        .map-node {
            position: absolute;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            transform: translate(-50%, -50%) scale(.96);
            min-width: 155px;
            padding: 15px 20px;
            border: 1px solid rgba(75,85,99,.9);
            border-radius: 12px;
            background: rgba(31,41,55,.94);
            box-shadow: 0 12px 30px rgba(0,0,0,.25);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition:
                opacity .28s ease,
                transform .28s ease,
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease;
            z-index: 5;
        }

        .map-node.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .map-node:hover {
            border-color: rgba(129,140,248,.8);
            background: rgba(49,46,129,.28);
            box-shadow: 0 0 0 1px rgba(99,102,241,.18), 0 14px 34px rgba(0,0,0,.3);
        }

        .map-node.selected {
            border-color: var(--accent);
            background: rgba(79,70,229,.20);
            box-shadow: 0 0 0 2px rgba(99,102,241,.16), 0 0 30px rgba(99,102,241,.14);
        }

        .map-node.root {
            min-width: 210px;
            padding: 21px 28px;
            border-radius: 16px;
            border-color: rgba(129,140,248,.65);
            background: rgba(30,41,59,.97);
            box-shadow: 0 0 0 1px rgba(99,102,241,.12), 0 18px 50px rgba(0,0,0,.36);
        }

        .map-node.major {
            min-width: 180px;
            border-color: rgba(99,102,241,.45);
        }

        .map-node.child {
            min-width: 150px;
            padding: 12px 16px;
        }

        .map-node.leaf {
            min-width: 140px;
            padding: 10px 14px;
            border-radius: 10px;
        }

        .node-en {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .10em;
            color: #9CA3AF;
        }

        .root .node-en {
            font-size: 14px;
            letter-spacing: .08em;
            color: #A5B4FC;
        }

        .major .node-en {
            color: #C7D2FE;
        }

        .node-zh {
            display: block;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .12em;
            color: #F3F4F6;
        }

        .root .node-zh {
            color: #FFFFFF;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: .08em;
        }

        .major .node-zh {
            color: #C7D2FE;
        }

        .node-status {
            display: block;
            margin-top: 7px;
            font-size: 9px;
            color: #6B7280;
            letter-spacing: .08em;
        }

        .map-node.has-content .node-status {
            color: #818CF8;
        }

        .legend-panel,
        .info-panel {
            position: fixed;
            z-index: 30;
            background: rgba(17,24,39,.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55,65,81,.9);
            box-shadow: 0 15px 45px rgba(0,0,0,.3);
        }

        .legend-panel {
            left: 22px;
            bottom: 22px;
            width: 255px;
            padding: 16px;
            border-radius: 14px;
        }

        .info-panel {
            right: 22px;
            bottom: 22px;
            width: 330px;
            max-height: 62vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: 16px;
            transform: translateY(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
        }

        .info-panel.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(55,65,81,.75);
            color: #A5B4FC;
            font-size: 9px;
            margin: 2px;
        }

        .control-btn {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(75,85,99,.9);
            border-radius: 9px;
            background: rgba(31,41,55,.86);
            color: #D1D5DB;
            transition: .2s ease;
        }

        .control-btn:hover {
            border-color: rgba(129,140,248,.75);
            color: white;
            background: rgba(79,70,229,.18);
        }

        .map-controls {
            position: fixed;
            right: 22px;
            top: 96px;
            z-index: 30;
            display: flex;
            gap: 7px;
        }

        .breadcrumb {
            position: fixed;
            left: 22px;
            top: 96px;
            z-index: 30;
            padding: 8px 12px;
            border: 1px solid rgba(55,65,81,.85);
            border-radius: 999px;
            background: rgba(17,24,39,.76);
            backdrop-filter: blur(10px);
            color: #9CA3AF;
            font-size: 11px;
        }

        .mobile-note {
            display: none;
        }

        @media (max-width: 767px) {
            .map-shell {
                height: calc(100vh - 68px);
                min-height: 600px;
            }

            #map-stage {
                width: 1400px;
                height: 1000px;

            .map-node {
                min-width: 145px;
            }

            .map-node.root {
                min-width: 165px;
            }

            .map-node.major {
                min-width: 145px;
            }

            .map-node.child {
                min-width: 125px;
            }

            .map-node.leaf {
                min-width: 112px;
            }

            .legend-panel {
                left: 12px;

                width: calc(100% - 24px);
                padding: 11px 13px;

            .info-panel {
                left: 12px;
                right: 12px;

                width: auto;
                max-height: 30vh;

                right: 12px;

</head>

/* =========================================================

const stage = document.getElementById("map-stage");
const svg = document.getElementById("connections");
const shell = document.getElementById("map-shell");

const allTags = [];
const tagMap = new Map();

function flatten(nodes, parent = null, level = 0, path = []) {
    nodes.forEach(node => {
        const item = {
            ...node,
            parent,
            level,
            path: [...path, node.id]
        };
        allTags.push(item);
        tagMap.set(node.id, item);
        if (node.children) flatten(node.children, node.id, level + 1, item.path);
    });
}

flatten(tagTree);

const duplicateTagIds = allTags
    .map(tag => tag.id)
    .filter((id, index, arr) => arr.indexOf(id) !== index);

if (duplicateTagIds.length) {
    console.warn("Duplicate map tag IDs:", [...new Set(duplicateTagIds)]);
}

const contentTagAliases = {
    "fisheries-ecology-topic": "fisheries-ecology",
    "photography-topic": "photography",
    "create-ai-image": "ai-image",
    "create-ai-video": "ai-video",
    "create-comfyui": "comfyui",
    "create-lora": "lora",
    "teach-digital-transformation": "digital-transformation"
};

function contentForTag(id) {
    const contentId = contentTagAliases[id] || id;

    return {
        projects: projects.filter(p => p.tags.includes(contentId)),
        experiences: experiences.filter(e => e.tags.includes(contentId))
    };
}

function hasContent(id) {
    const c = contentForTag(id);
    const node = tagMap.get(id);
    const linkCount = node && Array.isArray(node.links) ? node.links.length : 0;

    return c.projects.length + c.experiences.length + linkCount > 0;
}

/*
    Mind-map layout:
    ROOT
      ↓
    5 major branches
      ↓
    category
      ↓
    leaf
*/

const BASE_WIDTH = 1400;
const BASE_HEIGHT = 1000;
const LEVEL_GAP = 205;
const SIBLING_GAP = 255;
const SIDE_PADDING = 90;

const positions = {};
let visibleUnits = new Map();

const visible = new Set(["root", ...tagTree.map(branch => branch.id)]);
let selectedId = null;

function visibleChildren(node) {
    return (node.children || []).filter(child => visible.has(child.id));
}

/*
   The map only allocates space for what is currently visible.
   This is the key behavior we want:

   Initial:
                 NICK HSU
                    |
       EXPLORE MAKE CREATE TEACH SHARE

   Click MAKE:
                 NICK HSU
                    |
                   MAKE
                    |
          MODEL / MOLD / ELECTRONICS / ...

   The canvas grows only when the expanded branch needs more room.
*/
function measureVisible(node) {
    const children = visibleChildren(node);

    if (!children.length) {
        visibleUnits.set(node.id, 1);
        return 1;
    }

    const total = children.reduce(
        (sum, child) => sum + measureVisible(child),
        0
    );

    visibleUnits.set(node.id, Math.max(1, total));
    return Math.max(1, total);
}

function placeVisibleSubtree(node, left, level) {
    const units = visibleUnits.get(node.id) || 1;
    const span = units * SIBLING_GAP;
    const x = left + span / 2;
    const y = 105 + level * LEVEL_GAP;

    positions[node.id] = { x, y };

    const children = visibleChildren(node);
    if (!children.length) return;

    let childLeft = left;

    children.forEach(child => {
        const childUnits = visibleUnits.get(child.id) || 1;
        const childSpan = childUnits * SIBLING_GAP;

        placeVisibleSubtree(child, childLeft, level + 1);
        childLeft += childSpan;
    });
}

function recalculateLayout() {
    Object.keys(positions).forEach(key => delete positions[key]);
    visibleUnits = new Map();

    const rootNode = {
        id: "root",
        children: tagTree
    };

    measureVisible(rootNode);

    const rootUnits = visibleUnits.get("root") || 5;
    const contentWidth = Math.max(
        BASE_WIDTH,
        rootUnits * SIBLING_GAP + SIDE_PADDING * 2
    );

    const maxVisibleLevel = allTags.reduce((max, tag) => {
        if (visible.has(tag.id)) return Math.max(max, tag.level);
        return max;
    }, 0);

    const contentHeight = Math.max(
        BASE_HEIGHT,
        180 + (maxVisibleLevel + 1) * LEVEL_GAP
    );

    stage.style.width = `${contentWidth}px`;
    stage.style.height = `${contentHeight}px`;

    svg.setAttribute("viewBox", `0 0 ${contentWidth} ${contentHeight}`);

    positions.root = {
        x: contentWidth / 2,
        y: 70
    };

    const majorChildren = tagTree.filter(branch => visible.has(branch.id));
    const totalUnits = majorChildren.reduce(
        (sum, branch) => sum + (visibleUnits.get(branch.id) || 1),
        0
    );

    const totalSpan = totalUnits * SIBLING_GAP;
    let left = (contentWidth - totalSpan) / 2;

    majorChildren.forEach(branch => {
        const units = visibleUnits.get(branch.id) || 1;
        const span = units * SIBLING_GAP;

        placeVisibleSubtree(branch, left, 1);
        left += span;
    });
}

function nodeLevelClass(node) {
    if (node.id === "root") return "root";
    if (node.level === 0) return "major";
    if (node.level === 1) return "child";
    return "leaf";
}

function nodeText(id) {
    if (id === "root") {
        return `
            <span class="node-zh">許 智程</span>
            <span class="node-en">NICK HSU</span>
            <span class="node-status">PERSONAL MAP</span>
        `;
    }

    const node = tagMap.get(id);
    const linked = hasContent(id);

    return `
        <span class="node-zh">${node.zh}</span>
        <span class="node-en">${node.name}</span>
        <span class="node-status">${linked ? "✦ CONNECTED" : "— GROWING"}</span>
    `;
}

function createNode(id) {
    const el = document.createElement("button");
    const node = id === "root"
        ? { id: "root", level: -1, name: "NICK HSU", zh: "智程" }
        : tagMap.get(id);

    el.id = `node-${id}`;
    el.className = `map-node ${nodeLevelClass(node)} ${id !== "root" && hasContent(id) ? "has-content" : ""}`;
    el.innerHTML = nodeText(id);

    el.addEventListener("click", event => {
        event.stopPropagation();
        if (id === "root") {
            clearSelection();
            return;
        }
        selectNode(id);
    });

    stage.appendChild(el);
    return el;
}

createNode("root");
allTags.forEach(tag => createNode(tag.id));

function makeCurve(a, b) {
    const dy = b.y - a.y;
    const midY = a.y + dy * 0.52;

    return `M ${a.x} ${a.y}
            C ${a.x} ${midY},
              ${b.x} ${midY},
              ${b.x} ${b.y}`;
}

function drawBranches() {
    svg.innerHTML = "";

    allTags.forEach(node => {
        if (!visible.has(node.id)) return;

        const parentId = node.parent || "root";
        if (!visible.has(parentId)) return;

        const a = positions[parentId];
        const b = positions[node.id];

        if (!a || !b) return;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.classList.add("branch-path");

        if (selectedId) {
            const selected = tagMap.get(selectedId);
            const selectedPath = selected ? selected.path : [];

            const active = selectedId === node.id || selectedPath.includes(node.id) || selectedPath.includes(parentId);
            if (active) path.classList.add("active");
            else path.classList.add("dimmed");
        }

        path.setAttribute("d", makeCurve(a,b));
        svg.appendChild(path);
    });
}

function renderNodes() {
    recalculateLayout();

    const ids = ["root", ...allTags.map(t => t.id)];

    ids.forEach(id => {
        const el = document.getElementById(`node-${id}`);
        if (!el) return;

        const pos = positions[id];
        const shouldShow = visible.has(id);

        if (!pos || !shouldShow) {
            el.classList.remove("visible", "selected");
            return;
        }

        el.style.left = `${pos.x}px`;
        el.style.top = `${pos.y}px`;
        el.classList.add("visible");
        el.classList.toggle("selected", selectedId === id);
    });

    drawBranches();
}

function openChildren(id) {
    const node = tagMap.get(id);
    if (!node) return;

    if (node.children) {
        node.children.forEach(child => visible.add(child.id));
    }
}

function closeDescendants(id) {
    const node = tagMap.get(id);
    if (!node || !node.children) return;

    node.children.forEach(child => {
        closeDescendants(child.id);
        visible.delete(child.id);
    });

    if (selectedId && selectedId !== id) {
        const selectedNode = tagMap.get(selectedId);
        if (selectedNode && selectedNode.path.includes(id)) {
            selectedId = id;
        }
    }
}

function selectNode(id) {
    const node = tagMap.get(id);
    if (!node) return;

    selectedId = id;

    /*
       Clicking a node opens its next branch.
       Clicking it again closes that branch.
    */
    const children = node.children || [];

    if (children.length) {
        const alreadyOpen = children.every(child => visible.has(child.id));

        if (alreadyOpen) {
            closeDescendants(id);
        } else {
            openChildren(id);
        }
    }

    renderNodes();
    updateInfo(node);
}

function clearSelection() {
    selectedId = null;

    allTags.forEach(tag => {
        if (tag.level > 0) visible.delete(tag.id);
        else visible.add(tag.id);
    });

    visible.add("root");
    renderNodes();
    closeInfo();
}

function updateInfo(node) {
    const content = contentForTag(node.id);

    document.getElementById("info-type").textContent =
        node.level === 0 ? "MAIN BRANCH" : node.level === 1 ? "CATEGORY" : "TAG";

    document.getElementById("info-title").textContent = node.name;
    document.getElementById("info-zh").textContent = node.zh;

    /*
       TAG 個別介紹：
       只要在 tagTree 的節點加入 description: "..."，
       右下角資訊視窗就會自動使用這段文字。
       沒有設定 description 時，才使用原本的系統提示。
    */
    // links 會直接依照目前節點的 links 陣列自動計算，
    // 未來新增或刪除連結都不需要修改這段程式。
    const linkCount = Array.isArray(node.links) ? node.links.length : 0;
    const projectCount = content.projects.length;
    const experienceCount = content.experiences.length;
    const totalContentCount = projectCount + experienceCount + linkCount;

    let description = node.description || "";

    if (!description) {
        if (totalContentCount > 0) {
            description =
                `這個節點目前連結到 ${projectCount} 個作品、` +
                `${experienceCount} 段經驗與 ${linkCount} 個連結。`;
        } else if (node.children) {
            description = "繼續向下探索，可以看到這個分支的下一層內容。";
        } else {
            description = "這個節點目前還沒有建立內容，但它會保留在地圖中，等待未來成長。";
        }
    }

    document.getElementById("info-description").textContent = description;

    document.getElementById("info-count").textContent =
        `這個節點目前連結到 ${projectCount} 個作品、${experienceCount} 段經驗與 ${linkCount} 個連結。`;

    let html = "";

    /* =====================================================
       TAG LINKS
       -----------------------------------------------------
       只要在 tagTree 的節點加入：
       links: [
           { name: "Facebook", url: "https://..." },
           { name: "Instagram", url: "https://..." }
       ]
       右下角資訊視窗就會自動顯示可點擊連結。
       ===================================================== */
    if (node.links && node.links.length) {
        html += `
            <div class="mb-5">
                <h3 class="text-xs tracking-[0.16em] text-gray-300 mb-3">LINKS</h3>
                <div class="space-y-2">
                    ${node.links.map(link => `
                        <a
                            href="${escapeHtml(link.url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="flex items-center justify-between rounded-lg border border-gray-800 bg-gray-800/40 px-3 py-2 text-sm text-indigo-300 hover:text-white hover:border-indigo-500/50 hover:bg-indigo-500/10 transition"
                        >
                            <span>${escapeHtml(link.name)}</span>
                            <span class="text-gray-500">↗</span>
                        </a>
                    `).join("")}
                </div>
            </div>
        `;
    }

    if (content.projects.length) {
        html += `<h3 class="text-xs tracking-[0.16em] text-gray-300 mb-3">PROJECTS</h3>`;
        content.projects.forEach(project => {
            html += `
                <div class="rounded-lg border border-gray-800 bg-gray-800/40 p-3 mb-3">
                    <p class="text-white text-sm font-semibold">${escapeHtml(project.title)}</p>
                    <p class="text-gray-500 text-xs mt-1">${escapeHtml(project.subtitle)}</p>
                </div>
            `;
        });
    }

    if (content.experiences.length) {
        html += `<h3 class="text-xs tracking-[0.16em] text-gray-300 mb-3 mt-5">EXPERIENCES</h3>`;
        content.experiences.forEach(exp => {
            html += `
                <div class="rounded-lg border border-gray-800 bg-gray-800/40 p-3 mb-3">
                    <p class="text-white text-sm font-semibold">${escapeHtml(exp.title)}</p>
                    <p class="text-gray-500 text-xs mt-1">${escapeHtml(exp.subtitle)}</p>
                </div>
            `;
        });
    }

    if (node.children && node.children.length) {
        html += `
            <div class="mt-5 pt-4 border-t border-gray-800">
                <p class="text-xs text-gray-500 mb-2">NEXT BRANCH</p>
                <div>
                    ${node.children.map(child => `<span class="tag-pill">${escapeHtml(child.name)}</span>`).join("")}
                </div>
            </div>
        `;
    }

    document.getElementById("info-content").innerHTML = html;
    document.getElementById("info-panel").classList.add("show");
    document.getElementById("breadcrumb-current").textContent = node.name;
}

function closeInfo() {
    document.getElementById("info-panel").classList.remove("show");
    document.getElementById("breadcrumb-current").textContent = "NICK HSU";
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =========================================================
   ZOOM / PAN
   ========================================================= */

let scale = 1;
let panX = 0;
let panY = 0;

function applyTransform() {
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
}

function zoomAt(delta) {
    scale = Math.max(0.65, Math.min(1.35, scale + delta));
    applyTransform();
}

function resetView() {
    scale = window.innerWidth < 768 ? 0.78 : 1;
    panX = 0;
    panY = 0;
    applyTransform();
}

document.getElementById("zoom-in").addEventListener("click", () => zoomAt(0.08));
document.getElementById("zoom-out").addEventListener("click", () => zoomAt(-0.08));
document.getElementById("reset-view").addEventListener("click", () => {
    clearSelection();
    resetView();
});

document.getElementById("close-info").addEventListener("click", closeInfo);

/* Mouse / touch dragging */

let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let initialPanX = 0;
let initialPanY = 0;

shell.addEventListener("pointerdown", event => {
    if (event.target.closest(".map-node") || event.target.closest(".map-controls") || event.target.closest(".info-panel")) return;

    if (window.innerWidth < 768 && document.getElementById("info-panel").classList.contains("show")) {
        closeInfo();
    }

    // Prevent the browser from starting text selection when the user begins dragging.
    if (window.getSelection) {
        window.getSelection().removeAllRanges();
    }

    dragging = true;
    shell.classList.add("dragging");
    dragStartX = event.clientX;
    dragStartY = event.clientY;
    initialPanX = panX;
    initialPanY = panY;
    shell.setPointerCapture(event.pointerId);
});

shell.addEventListener("pointermove", event => {
    if (!dragging) return;

    // Keep accidental text selection from appearing during a drag.
    if (window.getSelection) {
        window.getSelection().removeAllRanges();
    }

    panX = initialPanX + (event.clientX - dragStartX);
    panY = initialPanY + (event.clientY - dragStartY);
    applyTransform();
});

shell.addEventListener("pointerup", event => {
    dragging = false;
    shell.classList.remove("dragging");
    try { shell.releasePointerCapture(event.pointerId); } catch {}
});

shell.addEventListener("pointercancel", () => {
    dragging = false;
    shell.classList.remove("dragging");
});

shell.addEventListener("wheel", event => {
    event.preventDefault();
    zoomAt(event.deltaY < 0 ? 0.05 : -0.05);
}, { passive: false });

window.addEventListener("resize", resetView);

/* Initial state */

renderNodes();
resetView();
</script>
